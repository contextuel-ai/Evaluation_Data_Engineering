<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle Verification Report</title>
    <style>

        :root {
            --color-bg: #f8f9fa;
            --color-surface: #ffffff;
            --color-text: #212529;
            --color-text-muted: #6c757d;
            --color-border: #dee2e6;
            --color-error: #dc3545;
            --color-warning: #ffc107;
            --color-success: #28a745;
            --color-info: #17a2b8;
            --color-code-bg: #f1f3f5;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 6px;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 
                         'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--color-text);
            background-color: var(--color-bg);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--color-border);
        }
        
        header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 0.5rem;
        }
        
        .input-file {
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }
        
        .input-file code {
            background-color: var(--color-code-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }
        
        /* Prefix Legend */
        .prefix-legend {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 0;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
        }
        
        .prefix-legend summary {
            cursor: pointer;
            padding: 1rem 1.5rem;
            list-style: none;
            display: flex;
            align-items: center;
        }
        
        .prefix-legend summary::-webkit-details-marker {
            display: none;
        }
        
        .prefix-legend summary::before {
            content: '▶';
            display: inline-block;
            margin-right: 0.5rem;
            font-size: 0.75rem;
            transition: transform 0.2s;
            color: var(--color-text-muted);
        }
        
        .prefix-legend[open] summary::before {
            transform: rotate(90deg);
        }
        
        .prefix-legend summary h2 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
            color: var(--color-text-muted);
            display: inline;
        }
        
        .prefix-legend .prefix-table {
            margin: 0 1.5rem 1rem 1.5rem;
            width: calc(100% - 3rem);
        }
        
        .prefix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        
        .prefix-table th,
        .prefix-table td {
            text-align: left;
            padding: 0.4rem 0.75rem;
            border-bottom: 1px solid var(--color-border);
        }
        
        .prefix-table th {
            font-weight: 600;
            color: var(--color-text-muted);
            background-color: var(--color-bg);
        }
        
        .prefix-table code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.85em;
        }
        
        /* Summary */
        .summary {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-left: 4px solid var(--color-error);
            border-radius: var(--radius);
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
        }
        
        .summary.success {
            border-left-color: var(--color-success);
        }
        
        .summary h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .total-count {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .type-counts {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.5rem;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }
        
        /* Issue Sections */
        .issue-type {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        
        .issue-type summary {
            cursor: pointer;
            padding: 1rem 1.5rem;
            background-color: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            list-style: none;
            display: flex;
            align-items: center;
        }
        
        .issue-type summary::-webkit-details-marker {
            display: none;
        }
        
        .issue-type summary::before {
            content: '▶';
            display: inline-block;
            margin-right: 0.5rem;
            font-size: 0.75rem;
            transition: transform 0.2s;
            color: var(--color-text-muted);
        }
        
        .issue-type[open] summary::before {
            transform: rotate(90deg);
        }
        
        .issue-type summary h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
            display: inline;
        }
        
        .issue-type summary h2 .count {
            font-weight: 400;
            color: var(--color-text-muted);
        }
        
        .issue-type > h2 {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 1.5rem;
            background-color: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
        }
        
        .issue-type > h2 .count {
            font-weight: 400;
            color: var(--color-text-muted);
        }
        
        .predicate-group {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--color-border);
        }
        
        .predicate-group:last-child {
            border-bottom: none;
        }
        
        .predicate {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--color-text-muted);
            margin-bottom: 0.75rem;
        }
        
        .predicate code {
            background-color: var(--color-code-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            color: var(--color-info);
        }
        
        .issue-list {
            list-style: none;
        }
        
        .issue {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background-color: var(--color-bg);
            border-radius: var(--radius);
            border-left: 3px solid var(--color-error);
        }
        
        .issue:last-child {
            margin-bottom: 0;
        }
        
        .issue-header {
            margin-bottom: 0.5rem;
        }
        
        .line-number {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-text-muted);
            background-color: var(--color-surface);
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
        }
        
        .issue-content {
            margin-left: 0.5rem;
        }
        
        .line-content {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.85rem;
            background-color: var(--color-surface);
            padding: 0.5rem 0.75rem;
            border-radius: 3px;
            overflow-x: auto;
            margin-bottom: 0.5rem;
            border: 1px solid var(--color-border);
        }
        
        .message {
            font-size: 0.9rem;
            color: var(--color-text);
        }
        
        .no-issues {
            text-align: center;
            padding: 3rem;
            color: var(--color-success);
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--color-border);
            text-align: center;
            color: var(--color-text-muted);
            font-size: 0.85rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .type-counts {
                flex-direction: column;
                gap: 0.25rem;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Turtle Verification Report</h1>
            <p class="input-file">Input file: <code>/Users/tristanmartin/Desktop/llm_demo/Evaluation_Data_Engineering/Mistral/mistral_models.ttl</code></p>
        </header>
        
        
        
        
        <section class="summary success">
            <h2>Summary</h2>
            <p class="total-count">Total issues: 0</p>
        </section>

        
        <main>
            <p class="no-issues">No issues found. The file is valid.</p>
        </main>
        
        <footer>
            <p>Generated by Turtle Verification Tool</p>
        </footer>
    </div>
</body>
</html>
